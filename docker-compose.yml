version: '3.9'
name: 'booker'

services:
  redis:
    image: redis:alpine
    container_name: redis_queue
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - booker-net
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-orbit-images}
    ports:
      - "9000:9000"
      - "9010:9001"
    volumes:
      - minio_data:/data
      - ./services/minio:/init-scripts
    command: server /data --console-address ":9001"
    networks:
      - booker-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-orbit-images}
    volumes:
      - ./services/minio:/init-scripts
    entrypoint: ["/init-scripts/init-bucket.sh"]
    networks:
      - booker-net

  backend:
    build: ./services/backend
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: users-postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      MODE: ${MODE}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-orbit-images}
      MINIO_SECURE: "False"
    ports:
      - "8081:8080"
    depends_on:
      - users-postgres
      - minio
    volumes:
      - ./services/backend/logs:/usr/src/users/logs
    networks:
      - booker-net

  notification:
    build: ./services/notification
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: users-postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      MODE: ${MODE}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-orbit-images}
      MINIO_SECURE: "False"
    ports:
      - "8082:8080"
    depends_on:
      - users-postgres
      - minio
    networks:
      - booker-net

  calculation:
    build: ./services/calculation
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: users-postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      MODE: ${MODE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-orbit-images}
      MINIO_SECURE: "False"
    depends_on:
      - users-postgres
      - redis
      - minio
    networks:
      - booker-net

  users-postgres:
    image: postgres:alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    expose:
      - 5432
    volumes:
      - users-postgres-data:/var/lib/postgresql/data
    networks:
      - booker-net

volumes:
  users-postgres-data:
    name: booker_users_postgres_data
  redis_data:
    name: booker_redis_data
  minio_data:
    name: booker_minio_data

networks:
  booker-net:
    driver: bridge
    name: booker_network
